name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. A workflow with no `permissions:` takes the repository
# default, which on many repos is a write-scoped GITHUB_TOKEN — handed to
# every third-party action in the job. Nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leakguard:
    # Runs FIRST and independently of the tests. A commit that carries identity
    # into a public repo is a different class of failure from a failing test,
    # and it must not be reported as one line in a test summary.
    #
    # Make this a REQUIRED check in branch protection. Without that it reports
    # and nothing stops the merge, which is the same as not having it — the
    # leak this repo already shipped went in past a green build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Materialise the denylist
        # The denylist is a list of real names, so it cannot live in the tree of
        # a public repo — that would publish exactly what it exists to keep out.
        # It lives in the LEAKGUARD_CONFIG secret instead, and is written to a
        # path git ignores.
        #
        # A fork has no secret and gets base rules only. That is the correct
        # degradation: a fork cannot leak this operator's names because it does
        # not have them, and the alternative is every fork's CI failing on a
        # secret it can never hold.
        env:
          LEAKGUARD_CONFIG: ${{ secrets.LEAKGUARD_CONFIG }}
        run: |
          if [ -n "$LEAKGUARD_CONFIG" ]; then
            printf '%s' "$LEAKGUARD_CONFIG" > tools/leakguard/leakguard.toml
            echo "denylist supplied — names, domains and codenames are checked"
          else
            echo "::warning::no LEAKGUARD_CONFIG secret; base rules only (shapes, not names)"
          fi

      - name: Scan for identity leakage
        # --config is passed unconditionally. When the file is absent the tool
        # says so on stderr and runs base rules, which is louder than silently
        # choosing a mode.
        run: python3 tools/leakguard/leakguard.py --root . --config tools/leakguard/leakguard.toml

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run the suite
        # `--extra dev` is not optional: conftest.py builds the fake LM the
        # whole suite runs against out of dspy.utils.dummies, so without the
        # dev extra pytest cannot even start collection.
        run: uv run --extra dev --python ${{ matrix.python-version }} pytest -q
